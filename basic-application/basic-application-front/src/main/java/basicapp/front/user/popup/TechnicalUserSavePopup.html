<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<div wicket:id="body">
		<form wicket:id="form">
			<div class="row row-form">
				<div class="col-12">
					<div class="row row-form-group form-group">
						<div class="col-md-4">
							<label wicket:for="firstName" class="col-form-label form-label"><wicket:label /></label>
						</div>
						<div class="col-md-8">
							<input wicket:id="firstName" class="form-control" type="text" />
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="row row-form-group form-group">
						<div class="col-md-4">
							<label wicket:for="lastName" class="col-form-label form-label"><wicket:label /></label>
						</div>
						<div class="col-md-8">
							<input wicket:id="lastName" class="form-control" type="text" />
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="row row-form-group form-group">
						<div class="col-md-4">
							<label wicket:for="username" class="col-form-label form-label"><wicket:label /></label>
						</div>
						<div class="col-md-8">
							<input wicket:id="username" class="form-control" type="text" autocomplete="off" />
							<div class="form-text">
								<wicket:message key="user.common.form.username.help" />
							</div>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="row row-form-group form-group">
						<div class="col-md-4">
							<label wicket:for="emailAddress" class="col-form-label form-label"><wicket:label /></label>
						</div>
						<div class="col-md-8">
							<input wicket:id="emailAddress" class="form-control" />
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="row row-form-group form-group">
						<div class="col-md-4">
							<label wicket:for="locale" class="col-form-label form-label"><wicket:label /></label>
						</div>
						<div class="col-md-8">
							<select wicket:id="locale" class="form-control" />
						</div>
					</div>
				</div>
				<wicket:container wicket:id="addContainer">
					<div class="col-12">
						<div class="row row-form-group form-group">
							<div class="col-md-8 offset-md-4">
								<div class="form-check form-switch form-control-plaintext">
									<input wicket:id="enabled" class="form-check-input" type="checkbox" role="switch" />
									<label wicket:for="enabled" class="form-check-label"><wicket:label /></label>
								</div>
							</div>
						</div>
					</div>
				</wicket:container>
			</div>
		</form>
	</div>
	<div wicket:id="footer">
		<button wicket:id="cancel" class="btn btn-outline-secondary" type="button">
			<wicket:message key="common.action.cancel" />
		</button>
		<button wicket:id="save" class="btn btn-success" type="button">
			<span class="fa fa-fw fa-check" />
			<wicket:message key="common.action.save" />
		</button>
	</div>
</wicket:panel>
</html>
