<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:extend>
	<div wicket:id="passwordEditPopup" />
	
	<div class="content-header-section">
		<div class="content-header-container">
			<div class="content-header">
				<h1 wicket:id="title" class="content-header-title" />
				<div wicket:id="headerElementsSection" class="content-header-elements-section">
					<div class="row g-2 align-items-center">
						<div wicket:id="actionsContainer" class="col-auto ms-auto">
							<div class="row g-2 align-items-center">
								<div wicket:enclosure-component="passwordEdit" class="col-auto">
									<button wicket:id="passwordEdit" class="btn btn-primary" type="button">
										<span class="fa fa-fw fa-key" />
										<wicket:message key="user.common.action.password.edit" />
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="content-body-section">
		<div class="content-body-container">
			<div class="content-body">
				<div class="row g-4">
					<div class="col-md-6">
						<div wicket:id="description" />
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
</html>
